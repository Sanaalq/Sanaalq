  </text>
  <text x="124" y="212" fill="#D7F3FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">
    DevSecOps Engineer · Cloud Engineer
  </text>

  <g opacity="0.96">
    <!-- Shield icon: Security -->
    <rect x="124" y="236" width="70" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="124.5" y="236.5" width="69" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <g transform="translate(159 253)">
      <path d="M0 -9L10 -13L20 -9V2C20 9 15 14 10 16C5 14 0 9 0 2V-9Z" fill="none" stroke="#8BE9FF" stroke-width="2" stroke-linejoin="round"/>
      <path d="M5 1L9 5L16 -3" fill="none" stroke="#8BE9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Cloud icon: Cloud -->
    <rect x="214" y="236" width="78" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="214.5" y="236.5" width="77" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <g transform="translate(253 254)">
      <path d="M-14 4C-14 -1 -10 -4 -6 -4C-5 -8 -1 -11 4 -9C8 -11 13 -8 13 -3C16 -3 18 0 18 4C18 7 15 9 12 9H-11C-13 9 -14 6 -14 4Z" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Terminal icon: Automation -->
    <rect x="304" y="236" width="78" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="304.5" y="236.5" width="77" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <g transform="translate(343 253)" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13 -8L-4 0L-13 8"/>
      <path d="M0 8H13"/>
    </g>
  </g>
